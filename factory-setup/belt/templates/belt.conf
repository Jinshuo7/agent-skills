# belt.conf - sourced as shell. Every key is optional EXCEPT WORKER_CMD and
# REVIEWER_CMD, which are required; unset keys use the default.
# One KEY="value" per line.

# Base branch for belt/<issue> and PRs. Default: the repo's default branch.
#BASE_BRANCH="main"

# Shell commands run in the worktree. Empty or unset = SKIPPED.
#CHECK_BUILD="make build"
#CHECK_TEST="make test"
#CHECK_LINT="make lint"
# Xcode projects (iPhone or Mac) MUST set both keys below.
# CHECKS_UNSANDBOXED="1": Apple's compiler and asset tools start their own
# sandbox and refuse to nest, so xcodebuild and swift build always fail inside
# a check's sandbox. The check keeps its throwaway HOME but has no sandbox, so
# a test naming an absolute real path is not blocked; the backup is the safety
# net. See the CHECKS_UNSANDBOXED key further down.
#export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"
# Export DEVELOPER_DIR as well; belt sources this file and the checks inherit
# it. Local checks still build for the simulator: with the throwaway HOME there
# is no real keychain, so signing for a physical device fails.

# The slow whole-project suite: once per batch and before each release, never
# per ticket. Empty = off. `belt suite` runs it on the base branch (detached);
# `belt suite --must-pass` checks the release gate.
#FULL_SUITE_CMD="make test-all"
# Hard cap for one full-suite run. Exit 124 counts as infra (UNKNOWN, no red issue).
#SUITE_TIMEOUT_MIN="120"

# Check and suite commands run code your worker wrote, so they get the same
# sandbox and throwaway HOME as a slot. 1 drops only the sandbox and keeps the
# throwaway HOME. An Xcode project (iPhone or Mac) must set 1: Apple's tools
# cannot nest (see the Xcode block above). Elsewhere prefer fixing the tool
# over setting this.
#CHECKS_UNSANDBOXED="0"

# The full suite is batched. BATCH is planned, not read yet.
# Batch ceiling, never a target; 1 = no batching. Size inside it is a judgement each round.
#BATCH="1"

# Minutes per stage before `belt watch` reports it as over budget: stages impl,
# review, fix, ci, batch-ci, ticket (from each ticket's timings.tsv).
#BUDGETS="impl=30 review=10 fix=20 ci=40 batch-ci=45 ticket=120"

# Hang detection for one model call (worker, reviewer, risky reviewer, on-call).
# A call is hung, never merely slow: normal runs take 50-95 minutes. When for
# SLOT_IDLE_MIN minutes its stdout/stderr/out files have not grown, no file in
# its work folder changed and its process tree used no CPU, it is killed with
# its whole process tree, counts as failed, and gets one retry.
#SLOT_IDLE_MIN="20"
# Last-resort ceiling for one call, in minutes. Not a timeout for live work.
#SLOT_MAX_MIN="180"

# --- on-call fixer and owner pings (belt watch) ------------------------------
# Watch keys: stuck:<n>, lead:<n>, budget:<n>:<stage>:<start>, silent:<n>,
# stale:<n> (claimed:belt with no live holder), conflict:<n> (merge-conflicted
# belt PR with no CI), red:<sha>. Persistent keys keep retrying the on-call
# every pass until the 2-attempt cap opens needs-owner.
# Required for `belt watch`. One shell line with the slot contract: run in the
# project checkout with BELT_PROMPT_FILE and BELT_OUT_FILE set. Its last line
# must be exactly `ONCALL: FIXED`, `ONCALL: WAITING` or `ONCALL: OWNER <sentence>`.
#ONCALL_CMD='pi --provider <provider> --model <model> -p "$(cat "$BELT_PROMPT_FILE")"'
# Hard ceiling for one on-call call (SLOT_IDLE_MIN still detects a hang).
#ONCALL_TIMEOUT_MIN="30"
# A live ticket whose log has not changed, no output file grew, nothing in its
# work folder changed and whose process tree used no CPU for this many minutes,
# with no CI run in progress or queued, is hung (and reported as silent).
#SILENT_MIN="45"
# CPU a run must use, in hundredths of a second a minute, to count as working. A hung worker uses about 7.
#SILENT_CPU_CS_MIN="20"
# Batch CI watch: open PRs on this branch prefix, this workflow, and minutes before a run counts as overdue.
#BATCH_BRANCH_PREFIX="batch/"
#BATCH_CI_WORKFLOW="CI"
#BATCH_CI_MAX_MIN="240"
# A merge-conflicted belt PR gets no pull_request CI at all. After this many
# minutes with no CI run and mergeable_state=dirty, watch reports conflict:<n>
# (not silent:<n>) so the on-call resolves it instead of waiting forever.
#CONFLICT_MIN="10"
# A risky PR waiting on the lead longer than this gets one owner ping.
#LEAD_WAIT_MIN="120"
# One shell line run with the message in $BELT_MESSAGE (default: macOS notification).
#OWNER_NOTIFY_CMD='osascript -e "display notification \"$BELT_MESSAGE\" with title \"belt\""'

# --- backup (belt backup, and once a day from belt watch) --------------------
# Where snapshots go: BACKUP_DIR/<owner>__<repo>/<YYYYMMDD-HHMM>/ . Each snapshot
# hardlinks unchanged files from the previous one, never uses --delete and never
# touches older snapshots except keeping the newest 14. Empty = no backup, and
# watch pings the owner once.
#BACKUP_DIR="/Volumes/Backup/belt"
# Space-separated folders to include in every snapshot (your own tools, e.g. a
# checkout of a CLI you use). They are write-denied to every slot and check.
#TOOLS_DIR="/Users/me/tools/lead-cli /Users/me/tools/scripts"

# --- slot guard --------------------------------------------------------------
# Every model slot and check runs with a throwaway HOME and, on macOS, under
# sandbox-exec: it may write only its own work folder, its caches and the paths
# below. It can never write the real home, /Volumes, belt.conf or TOOLS_DIR.
# There is deliberately no key or env var to turn the guard off per slot.
# GitHub access is on-call only: the on-call slot gets GH_TOKEN and git's gh
# credential helper, and every slot runs with GIT_TERMINAL_PROMPT=0 so git never
# waits on a prompt. Workers, reviewers and checks reach GitHub only through
# belt, which does every gh write and every push.
# Extra absolute paths a slot may write (space-separated, default empty).
#SLOT_WRITE_ALLOW="/Users/me/shared-cache"
# Defaults are today's belt behaviour: claimed:belt labels, belt/<n> branches
# and belt's own ticket log and lock.
# The label a claimed ticket wears; watch keys, restarts and the on-call
# playbook use it.
#CLAIM_LABEL="claimed:belt"
# Branch prefix for the ticket's PRs (one trailing slash is always used).
#BRANCH_PREFIX="belt/"
# Shell line printing the ticket's log path; the issue number is in $BELT_ISSUE.
# Default: belt's own log, BELT_HOME/<slug>/<n>/log.
#TICKET_LOG_CMD='printf "%s\n" "<your-runner-dir>/$BELT_ISSUE/run.log"'
# Shell line exiting 0 while the ticket's run is alive; the issue number is in
# $BELT_ISSUE. Print the run's process id on the first line: it drives the CPU
# part of the hang test. Without a pid belt assumes the run is busy, so a
# genuinely computing ticket is never flagged silent. Default: belt's own
# ticket.lock holder test.
#TICKET_ALIVE_CMD='pgrep -f "pipeline $BELT_ISSUE" | head -n 1'
# Shell line that restarts the ticket in the background; the issue number is in
# $BELT_ISSUE. The on-call never runs this: it ends with `ONCALL: RESTART <n>`
# and the watch pass (outside the sandbox) runs the command, under the
# per-issue attempt cap. Default: belt run <n>.
#TICKET_RESTART_CMD='bash "<your-runner-dir>/restart.sh" $BELT_ISSUE'
# Extra text appended to the on-call playbook (may be several lines).
#ONCALL_EXTRA_RULES='Check the pipeline dashboard before restarting.'

# Space-separated globs of risky paths. '*' also matches '/', a trailing '/'
# means the whole folder. A matching change is never auto-merged.
#RISKY_PATHS=".github/ migrations/ infra/* *secret*"

# How many tickets run at once in queue mode. 0 (the default) = no cap: start
# every frontier ticket. A positive number caps concurrency.
#MAX_PARALLEL="0"

# How many check commands (build/test/lint) run at once. Default: CPU count,
# but 1 when CHECKS_UNSANDBOXED=1 (Xcode): each check boots a simulator, and
# several beside CI on the same Mac made CI time out. Raise it only when CI
# runs elsewhere. Model calls (worker/reviewer) are not limited by this.
#CHECK_SLOTS="4"
# Minimum seconds between two check starts. Default 0, or 20 for Xcode:
# simulators booted in the same second crashed their test runners.
#CHECK_START_GAP_SEC="20"
# Unset DEVELOPER_DIR while xcode-select points at the Command Line Tools and
# Xcode is installed: belt sets it to Xcode, since xcodebuild and simctl fail
# with the Command Line Tools alone.

# Optional lock path (e.g. a shared device). Check commands run holding it.
#DEVICE_LOCK="/tmp/belt-device.lock"

# Worker and reviewer slots: one shell command line each, run with 'bash -c'
# inside the work folder (reviewer: its own read-only copy). stdin is /dev/null.
# The belt exports BELT_PROMPT_FILE (the job) and BELT_OUT_FILE (where the
# answer may go). Both are required: no ticket is claimed without them.
#
# Examples (fill <provider>/<model> from your tool's model list; mechanics per
# tool are in that tool's own docs):
#WORKER_CMD='pi --provider <provider> --model <model> -p "$(cat "$BELT_PROMPT_FILE")" </dev/null'
#WORKER_CMD='claude -p --model <model> --permission-mode acceptEdits < "$BELT_PROMPT_FILE"'
#REVIEWER_CMD='codex exec -m <model> -s read-only --skip-git-repo-check -o "$BELT_OUT_FILE" - < "$BELT_PROMPT_FILE"'
#REVIEWER_CMD='claude -p --model <model> --allowedTools Read,Grep,Glob --disallowedTools Bash,Edit,Write,NotebookEdit < "$BELT_PROMPT_FILE"'
# The reviewer's folder must stay unchanged, or the review fails.
#
# Optional higher-power reviewer for risky diffs (any path matching RISKY_PATHS,
# or 'Risky: yes' in the issue body). Same contract as REVIEWER_CMD. When unset,
# risky PRs use REVIEWER_CMD too. Routine PRs always use REVIEWER_CMD.
#RISKY_REVIEWER_CMD='codex exec -m <model> -s read-only --skip-git-repo-check -o "$BELT_OUT_FILE" - < "$BELT_PROMPT_FILE"'

# Pause queue mode during these windows (end exclusive) in PAUSE_TZ (default: local time); only if the owner asks.
#PAUSE_WINDOWS="Mon-Fri@09:00-12:00"

# Minutes to wait for remote CI on the PR before leaving it open for a lead.
#CHECK_WAIT_MIN="15"

# Force a repo slug when a checkout has more than one remote. Default: gh repo view.
#REPO="owner/name"
